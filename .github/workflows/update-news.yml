name: Aktualizacja newsów RSS

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalacja zależności
        run: npm install

      - name: Pobranie i przetłumaczenie newsów
        run: node update-news.js

      - name: Zapisanie zmian w repozytorium
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/news.json data/apod.json sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automatyczna aktualizacja bazy odkryć" && git push)
